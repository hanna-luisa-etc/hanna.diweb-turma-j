<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Exercício 3 - Aula 15</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<form method="get">
<h1>Ouvidoria</h1>
<label for="email">Nome</label>
<span class="obrigatorio">*</span>
<br>

<input type="text" name="nome" id="nome" size="100" required 
placeholder="Informe seu nome." autofocus>
<br>

<label for="email">E-mail</label>
<span class="obrigatorio">*</span>
<br>
<input type="text" name="email" id="email" size="100" required 
placeholder="Informe seu e-mail.">

<label for="tipo">Tipo de Solicitação</label>
<span class="obrigatorio">*</span>
<br>

<select name="tipo" id="tipo" required>
<option value="">Selecione...</option>
<option value="reclamação">Reclamação...</option>
<option value="elogio">Elogio...</option>
<option value="sugestão">Sugestão...</option>
</select>
<br>

<label for="mensagem">Mensagem</label>
<span class="obrigatorio">*</span>
<br>

<textarea name="mensagem" id="mensagem" rows="5" cols="98" placeholder="Digite sua mensagem aqui." required></textarea>
<br>

<input type="submit" value="Enviar" class="button">
<input type="reset" value="Limpar" class="button">
</form>
</body>
</html>
