<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Exercício 3 - Aula 15</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<form>
<h1>Ouvidoria</h1>
<label for="email">Nome</label><br>
<span class="obrigatorio">*</span>
<br>

<input type="text" name="nome" id="nome" size="100" required 
placeholder="Informe seu nome." autofocus>
<br>

<label for="email">E-mail</label><br>
<span class="obrigatorio">*</span>
<br>
<input type="text" name="email" id="email" size="100" required 
placeholder="Informe seu e-mail." autofocus>
<br>

<label for="tipo">Tipo de Solicitação</label><br>
<span class="obrigatorio">*</span>
<br>

<select name="tipo" id="tipo" required>
<option value="">Selecione...</option>
<option value="reclamação">Reclamação...</option>
<option value="elogio">Elogio...</option>
<option value="sugestão">Sugestão...</option>
</select>
<br>

<label for="mensagem">Mensagem</label><br>
<span class="obrigatorio">*</span>
<br>

<textarca name="mensagem" id="mensagem" rows="5" cols="98" aria-placeholder="Digite dua mensagem aqui." required></textarca>
<hr>

<input type="submit" value="Enviar" class="button">
<input type="reset" value="LImpar" class="button">
</form>
</body>
</html>
